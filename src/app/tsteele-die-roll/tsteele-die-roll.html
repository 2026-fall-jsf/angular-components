<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Tom's Die Roll Component
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <br />
        <button
            matButton="outlined"
            [disabled]="rolling()"
            (click)="rollDie()"
        >
            Roll the die
        </button>
        &nbsp;
        <span
            class="die"
            [class.spinning]="rolling()"
            (animationend)="finishRoll()"
        >
            {{ face() }}
        </span>
    </mat-card-content>
</mat-card>
