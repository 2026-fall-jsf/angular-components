<mat-card>
  <mat-card-header>
    <mat-card-title>Dice Roller (d6)</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="die" aria-live="polite">
      <div class="scene" [attr.aria-label]="result() ? 'Rolled ' + result() : 'Die'">
        <div class="tilt">
          <div
            class="cube"
            [style.transform]="'rotateX(' + rotation().x + 'deg) rotateY(' + rotation().y + 'deg)'"
            [style.transition-duration.ms]="transitionMs()"
            [class.settling]="!rolling()"
          >
            @for (face of faces; track face.value) {
              <div class="face face-{{ face.value }}">
                @for (cell of cells; track cell) {
                  <span class="cell">
                    @if (face.pips.includes(cell)) {
                      <span class="pip"></span>
                    }
                  </span>
                }
              </div>
            }
          </div>
        </div>
      </div>
      <span class="value">{{ rolling() ? '...' : (result() ?? '?') }}</span>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button [disabled]="rolling()" (click)="roll()">
      🎲 {{ rolling() ? 'Rolling...' : 'Roll' }}
    </button>
  </mat-card-actions>
</mat-card>

<div class="confetti" aria-hidden="true">
  @for (piece of confetti(); track $index) {
    <span
      class="piece"
      [style.left.%]="piece.left"
      [style.background]="piece.color"
      [style.animation-delay.s]="piece.delay"
      [style.animation-duration.s]="piece.duration"
      [style.--drift.px]="piece.drift"
    ></span>
  }
</div>
