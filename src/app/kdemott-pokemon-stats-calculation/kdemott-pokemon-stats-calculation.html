<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            Pok&eacute;mon Stats Calculation
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <br>
        <mat-form-field>
            <mat-label>
                HP IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="hpIv()" (input)="updateHpIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Attack IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="attackIv()" (input)="updateAttackIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Defense IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="defenseIv()" (input)="updateDefenseIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Special Attack IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="specialAttackIv()" (input)="updateSpecialAttackIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Special Defense IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="specialDefenseIv()" (input)="updateSpecialDefenseIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Speed IV
            </mat-label>
            <input type="number" min="0" max="31" matInput [value]="speedIv()" (input)="updateSpeedIv($event.target.value)" />
        </mat-form-field>
        <mat-form-field>
            <mat-label>
                Level
            </mat-label>
            <input type="number" min="1" max="100" matInput [value]="level()" (input)="updateLevel($event.target.value)" />
        </mat-form-field>
        &nbsp;
        <button matButton="outlined" (click)="calculateStats()">
            =
        </button>
        &nbsp;
        {{ finalHp() }}
        |
        {{ finalStatAttack()}}
        |
        <!-- {{ finalStatDefense()}}
        |
        {{ finalStatSpecialAttack()}}
        |
        {{ finalStatSpecialDefense()}}
        | -->
        {{ finalStatSpeed()}}
    </mat-card-content>
</mat-card>
