<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            {{ title() }}
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="result">
            <span class="die" [class.rolling]="rolling()" aria-hidden="true">{{ face() ?? '🎲' }}</span>
            @for (piece of confetti(); track $index) {
                <span
                    class="confetti"
                    aria-hidden="true"
                    [style.--x.px]="piece.x"
                    [style.--y.px]="piece.y"
                    [style.--rot.deg]="piece.rotation"
                    [style.background]="piece.color"
                    [style.animation-delay.ms]="piece.delay"
                ></span>
            }
            <span class="label" aria-live="polite">
                @if (rolling()) {
                    Rolling...
                } @else if (result() === null) {
                    Roll the die!
                } @else {
                    Rolled {{ result() }}
                }
            </span>
        </div>
        <button
            matButton="outlined"
            [disabled]="rolling()"
            (click)="roll()"
        >
            Roll d{{ sides() }}
        </button>
    </mat-card-content>
</mat-card>
