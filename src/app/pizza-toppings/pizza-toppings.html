<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Choose your pizza toppings...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <button
            (click)="checkAll()"
            matButton="filled"
        >
            All
        </button>
        &nbsp;
        <button
            (click)="uncheckAll()"
            matButton="outlined"
        >
            None
        </button>
        @for (topping of availablePizzaToppings(); track topping) {
            <p>
                <mat-checkbox
                    [checked]="topping.checked"
                    (change)="toggleTopping(topping)"         
                >
                    {{ topping.name }} ({{ topping.price | currency }})
                </mat-checkbox>
            </p>
        }

        <h3>
            Total: {{ total() | currency }}
        </h3>        
    </mat-card-content>    
</mat-card>


<section>
  <h3>How many pizzas would you like</h3>
  <mat-button-toggle-group
    name="favoriteColor"
    aria-label="Favorite Color"
    (click)="printPizzas()"
  >
    <mat-button-toggle value="One">One</mat-button-toggle>
    <mat-button-toggle value="Two">Two</mat-button-toggle>
    <mat-button-toggle value="Three">Three</mat-button-toggle>
  </mat-button-toggle-group>
</section>
