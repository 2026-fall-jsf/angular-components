<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            Choose your pizza toppings...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <!-- Delivery Date Picker -->
        <div class="delivery-date-container" style="margin: 16px 0;">
            <mat-form-field appearance="fill">
                <mat-label>Choose delivery date</mat-label>
                <input matInput [matDatepicker]="picker">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>

        <!-- Action Buttons -->
        <div style="margin-bottom: 16px;">
            <button
                (click)="checkAll()"
                mat-flat-button
            >
                All
            </button>
            &nbsp;
            <button
                (click)="uncheckAll()"
                mat-stroked-button
            >
                None
            </button>
        </div>

        <!-- Toppings List -->
        @for (topping of availablePizzaToppings(); track topping) {
            <p>
                <mat-checkbox
                    [checked]="topping.checked"
                    (change)="toggleTopping(topping)"        
                >
                    {{ topping.name }} ({{ topping.price | currency }})
                </mat-checkbox>
            </p>
        }

        <h3>
            Total: {{ total() | currency }}
        </h3>        
    </mat-card-content>    
</mat-card>
