<h2>Choose your Toppings</h2>
<button (click)="checkAll()" matButton="filled">All</button>
&nbsp;
<button (click)="uncheckAll()" matButton="outlined">None</button>

@for (topping of availablePizzaToppings(); track topping) {
  <p>
    <label>
      <input type="checkbox" [checked]="topping.checked" (change)="toggleTopping(topping)" />

      {{ topping.name }} ({{ topping.price | currency }})
    </label>
  </p>
}

<h3>Total: {{ total() | currency }}</h3>
