<h2>
    Choose your pizza toppings...
</h2>

<button
    (click)="checkAll()"
    matButton = "filled"
>
    All
</button>
<button
    (click)="uncheckAll()"
    matButton = "outlined"
>
    None
</button>

@for (topping of availablePizzaToppings(); track topping) {
    <p>
        <mat-checkbox
                type="checkbox"
                [checked]="topping.checked"
                (change)="toggleTopping(topping)" 
                >
            {{ topping.name }} ({{ topping.price | currency }})
        </mat-checkbox>
    </p>
}

<h3>
    Total: {{ total() | currency }}
</h3>
