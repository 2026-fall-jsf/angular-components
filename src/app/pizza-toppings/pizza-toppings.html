<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            Choose your pizza toppings...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <!-- Action Buttons -->
        <div style="margin-bottom: 16px;">
            <button
                (click)="checkAll()"
                mat-flat-button
            >
                All
            </button>
            &nbsp;
            <button
                (click)="uncheckAll()"
                mat-stroked-button
            >
                None
            </button>
        </div>

        <!-- Toppings List -->
        @for (topping of availablePizzaToppings(); track topping) {
            <p>
                <mat-checkbox
                    [checked]="topping.checked"
                    (change)="toggleTopping(topping)"        
                >
                    {{ topping.name }} ({{ topping.price | currency }})
                </mat-checkbox>
            </p>
        }

        <h3>
            Total: {{ total() | currency }}
        </h3>        
    </mat-card-content>    
</mat-card>

<!-- Custom Date Picker Component -->
<app-elee-date-picker></app-elee-date-picker>
