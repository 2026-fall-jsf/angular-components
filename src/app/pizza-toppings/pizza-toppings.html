<mat-card
appearance="outlined"
>
<mat-card-header>
    <mat-card-title>
        Choose your pizza toppings...
    </mat-card-title>
    <mat-card-header>
        <mat-card-content>
    
            <button
            (click)="checkAll()"
            matButton="filled"
            >

            </button>
     
        </mat-card-header>
<mat-card>


<h2>Choose your Toppings</h2>
<button (click)="checkAll()" matButton="filled">All</button>
&nbsp;
<button (click)="uncheckAll()" matButton="outlined">None</button>

        @for (topping of availablePizzaToppings(); track topping) {
        <p>
            <mat-checkbox type="checkbox" 
            [checked]="topping.checked" 
            (change)="toggleTopping(topping)">
            
            {{ topping.name }} ({{ topping.price | currency }})
            </mat-checkbox>
        </p>
        }

        <h3>Total: {{ total() | currency }}</h3>
