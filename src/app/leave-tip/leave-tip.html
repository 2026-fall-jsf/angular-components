<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Leave a tip
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-radio-group aria-label="Select an option">
            <mat-radio-button value="1">NO TIP</mat-radio-button>
            <mat-radio-button value="2">15%</mat-radio-button>
            <mat-radio-button value="3">20%</mat-radio-button>
            <mat-radio-button value="4">25%</mat-radio-button>
        </mat-radio-group>
    </mat-card-content>    
</mat-card>
