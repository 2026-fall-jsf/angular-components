<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Calculate Tax...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-form-field>
            <mat-label>
                Enter your total to add the tax
            </mat-label>
            <input 
            matInput
            value="3.00"/>
        </mat-form-field>
        &nbsp;
        <button
            matButton="outlined"
        >
            Add up tax
        </button>
        3.15
    </mat-card-content>
</mat-card>
