<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Calculate Tax...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-form-field>
            <mat-label>
                Enter your total to add the tax
            </mat-label>
            <input 
                type="number"
                matInput
                [value]="orderTotal()"
                /* (input)="updateOrderTotal($event.target.value)" */
            />
        </mat-form-field>
        &nbsp;
        <button
            matButton="outlined"
            (click)="add()"
        >
            Add tax (5%)
        </button>
        &nbsp;
        {{ taxSum() | currency }}
    </mat-card-content>
</mat-card>
