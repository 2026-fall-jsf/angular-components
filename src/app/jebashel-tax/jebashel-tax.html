<mat-card
    appearance="outlined"
>
    <mat-card-header>
        <mat-card-title>
            Calculate Tax...
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-form-field>
            <mat-label>
                Enter your total to add the tax
            </mat-label>
            <input 
                matInput
                [value]="orderTotal()"
            />
        </mat-form-field>
        &nbsp;
        <button
            matButton="outlined"
        >
            Add up tax
        </button>
        &nbsp;
        {{ taxSum() | currency }}
    </mat-card-content>
</mat-card>
